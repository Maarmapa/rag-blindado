name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Siempre corre: controles de seguridad y fragmentación. Sin credenciales,
  # sin base de datos, sin costo. Es la barrera que ningún PR puede saltarse.
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - name: Tests de guardas (OWASP LLM01/LLM02/LLM06)
        run: python -m pytest tests/ -v

  # Evaluación de calidad del RAG con Ragas. Requiere credenciales, así que
  # se salta en PRs de forks; en main es bloqueante.
  evals:
    runs-on: ubuntu-latest
    needs: guards
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ragb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ragb
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # El juez de Ragas hace la mayor parte de las llamadas de este job y no
      # necesita el modelo más caro para calificar relevancia y fidelidad.
      JUDGE_MODEL: claude-haiku-4-5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Indexar corpus
        run: python -m ragb.cli --tenant eval ingest corpus/ --write

      - name: Evaluar calidad (faithfulness / relevancy / precision)
        run: python -m evals.run

      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json
