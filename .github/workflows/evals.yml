name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Siempre corre: controles de seguridad y fragmentación. Sin credenciales,
  # sin base de datos, sin costo. Es la barrera que ningún PR puede saltarse.
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - name: Tests de guardas (OWASP LLM01/LLM02/LLM06)
        run: python -m pytest tests/ -v

  # Evaluación de calidad del RAG con Ragas. Requiere credenciales, así que
  # se salta en PRs de forks; en main es bloqueante.
  evals:
    runs-on: ubuntu-latest
    needs: guards
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ragb
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ragb
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # El juez de Ragas hace ~90% de las llamadas de este job (unas 56 sobre
      # ocho casos), así que el modelo elegido acá es el costo recurrente del
      # repo: cada push a cualquier PR vuelve a correr esto.
      #
      # Haiku califica bien relevancia y precisión de contexto. Para fidelidad
      # no: es una razón sobre pocas afirmaciones, y en respuestas cortas un
      # error del juez cuesta un tercio del puntaje. Con Haiku, cuatro
      # respuestas que citaban el corpus casi textualmente sacaron entre 0.667
      # y 0.833 sin tener nada inventado que recortar.
      #
      # Se intentó pagar Sonnet solo en fidelidad (16 llamadas de 56) y no se
      # pudo: Ragas manda `temperature` en cada llamada al juez y claude-sonnet-5
      # la rechaza con 400 ("`temperature` is deprecated for this model"). Los
      # ocho jobs de fidelidad murieron y la métrica quedó SIN MEDIR, que es
      # peor que medida y baja.
      #
      # `LangchainLLMWrapper(..., bypass_temperature=True)` existe justo para
      # esto (ragas/llms/base.py:153, agregado para los o1 de OpenAI). Queda
      # como trabajo aparte: subir el juez es una decisión de costo recurrente
      # —cada push a cualquier PR corre este job— y merece medirse antes, no
      # cambiarse a ciegas.
      JUDGE_MODEL: claude-haiku-4-5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Indexar corpus
        run: python -m ragb.cli --tenant eval ingest corpus/ --write

      - name: Evaluar calidad (faithfulness / relevancy / precision)
        run: python -m evals.run

      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json
