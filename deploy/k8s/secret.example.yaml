# EJEMPLO. Este archivo NO se aplica y NO está en kustomization.yaml: es la
# lista de claves que el Secret real tiene que tener, con los valores VACÍOS.
#
# El Secret real no vive en el repo (es público, y un secreto commiteado queda
# en la historia aunque se borre). Se crea directo en el clúster:
#
#   kubectl -n rag-blindado create secret generic rag-blindado-secrets \
#     --from-literal=DATABASE_URL='postgresql://usuario:password@host:5432/ragb' \
#     --from-literal=ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
#     --from-literal=RAGB_API_TOKEN="$(openssl rand -hex 32)"
#
# o, mejor, desde un gestor externo (External Secrets Operator, Sealed Secrets,
# Vault Agent) que lo materialice con este mismo nombre y estas claves.
#
# Sin RAGB_API_TOKEN el servicio arranca pero /query responde 503: cerrado por
# defecto, nunca abierto por olvido (ver ragb/api.py).
apiVersion: v1
kind: Secret
metadata:
  name: rag-blindado-secrets
  namespace: rag-blindado
  labels:
    app.kubernetes.io/name: rag-blindado
type: Opaque
stringData:
  DATABASE_URL: ""
  ANTHROPIC_API_KEY: ""
  RAGB_API_TOKEN: ""
